services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sidik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidik}
      POSTGRES_DB: sidik
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidik"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      # Database bersama (Neon): isi SIDIK_SHARED_DATABASE_URL di berkas .env folder ini.
      SIDIK_DATABASE_URL: ${SIDIK_SHARED_DATABASE_URL:-postgresql+psycopg://sidik:${POSTGRES_PASSWORD:-sidik}@db:5432/sidik}
      SIDIK_SIGNING_KEY_AUTOCREATE: ${SIDIK_SIGNING_KEY_AUTOCREATE:-true}
      SIDIK_DATA_DIR: /data
      # Kunci ledger tim disimpan terpisah dari kunci database lokal.
      SIDIK_SIGNING_KEY_PATH: /data/keys/${SIDIK_SIGNING_KEY_FILE:-ledger_ed25519.pem}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
