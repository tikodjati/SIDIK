[project]
name = "sidik-backend"
version = "0.1.0"
description = "SIDIK - Sistem Identifikasi Dokumen dan Investigasi Kebocoran (backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "reedsolo>=1.7",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Dipasang bertahap saat modul terkait dikerjakan (lihat docs/KEPUTUSAN_ARSITEKTUR.md)
forensics = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pytesseract>=0.3.13",
]
verifier = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
